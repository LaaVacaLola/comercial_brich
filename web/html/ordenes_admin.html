<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordenes de Compra</title>
  <link rel="stylesheet" href="../css/mercado_publico.css">
  <link rel="stylesheet" href="../css/admin_nav.css">
  <script defer src="../js/admin_nav.js"></script>
  <script defer src="../js/mercado_common.js"></script>
  <script defer src="../js/ordenes_admin.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="../img/logo.png" alt="Logo Comercial Brich">
      <span>Comercial Brich</span>
    </div>
    <a href="dashboard_admin.html" class="btn-back">Volver al Dashboard</a>
  </header>

  <main class="container">
    <h1>Ordenes de Compra</h1>
    <p class="subtitle">Ordenes de Mercado Publico recibidas por la empresa.</p>

    <section class="filters">
      <input type="date" id="fechaDesde" aria-label="Fecha desde">
      <input type="date" id="fechaHasta" aria-label="Fecha hasta">
      <select id="estado">
        <option value="todos">Todos los estados</option>
        <option value="enviadaproveedor">Enviada proveedor</option>
        <option value="aceptada">Aceptada</option>
        <option value="cancelada">Cancelada</option>
        <option value="recepcionconforme">Recepcion conforme</option>
        <option value="pendienterecepcion">Pendiente recepcion</option>
      </select>
      <select id="fuenteDatos" aria-label="Fuente de datos">
        <option value="cache">Cache local</option>
        <option value="api">API ChileCompra</option>
      </select>
      <button id="buscarBtn" class="btn-primary" type="button">Buscar</button>
      <button id="limpiarBtn" class="btn-secondary" type="button">Limpiar</button>
    </section>

    <section id="jobPanel" class="settings-card" hidden>
      <div class="job-header">
        <div>
          <strong id="jobTitle">Descarga de ordenes</strong>
          <span id="jobStatus" class="status-badge"></span>
        </div>
        <div class="job-actions">
          <button id="descargarBtn" class="btn-primary" type="button">Descargar OC</button>
          <button id="detenerBtn" class="btn-danger" type="button" hidden>Detener</button>
        </div>
      </div>
      <div id="jobProgressBar" hidden>
        <div class="progress-track">
          <div id="jobProgressFill" class="progress-bar"></div>
        </div>
        <span id="jobProgressText">0%</span>
      </div>
      <p id="jobLog" class="job-log-line"></p>
    </section>

    <button id="descargarBtnTop" class="btn-secondary" type="button">Descargar OC de ChileCompra</button>

    <p id="statusMessage" class="status-message">Cargando ordenes de la empresa...</p>

    <section class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Folio</th>
            <th>Nombre</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </section>

    <section class="pagination-bar" aria-label="Paginacion">
      <button id="prevPageBtn" class="btn-secondary" type="button">Anterior</button>
      <div id="pageButtons" class="page-buttons"></div>
      <button id="nextPageBtn" class="btn-secondary" type="button">Siguiente</button>
      <span id="pageInfo" class="page-info">Pagina 0 de 0</span>
    </section>
  </main>

  <div id="detailModal" class="modal">
    <div class="modal-content wide">
      <span class="close-btn">&times;</span>
      <h2>Detalle de orden</h2>
      <div id="detailContent"></div>
    </div>
  </div>
</body>
</html>
